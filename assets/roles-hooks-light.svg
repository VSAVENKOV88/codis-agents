<svg xmlns="http://www.w3.org/2000/svg" width="860" height="112" viewBox="0 0 860 112" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d"><title id="t">What it costs</title><desc id="d">Reviewer: 7 %, of a full-mode task’s tokens, 0.67 code defects per 1M IE; Tester: 36–44 %, of a full-mode task’s tokens: the costliest role; Light mode, cheaper by: 4.2×, 1.6M vs 6.8M IE per task (49 vs 138 min); its tasks are smaller; Owner questions mid-wave: 0, in waves 2 and 3, against 2 and 1 in waves 0 and 1</desc><g><title>Reviewer: 7 %, of a full-mode task’s tokens, 0.67 code defects per 1M IE</title><rect x="0.5" y="0.5" width="205" height="111" rx="8" fill="#f3f2ef" stroke="#e4e3df"/><rect x="16" y="16" width="3" height="12" rx="1.5" fill="#2a78d6"/><text x="25" y="26.5" font-size="12" fill="#52514e">Reviewer</text><text x="16" y="64" font-size="32" font-weight="600" fill="#0b0b0b" letter-spacing="-0.5">7 %</text><text x="16" y="84" font-size="11.5" fill="#6b6a65">of a full-mode task’s tokens,</text><text x="16" y="99" font-size="11.5" fill="#6b6a65">0.67 code defects per 1M IE</text></g><g><title>Tester: 36–44 %, of a full-mode task’s tokens: the costliest role</title><rect x="218.5" y="0.5" width="205" height="111" rx="8" fill="#f3f2ef" stroke="#e4e3df"/><rect x="234" y="16" width="3" height="12" rx="1.5" fill="#2a78d6"/><text x="243" y="26.5" font-size="12" fill="#52514e">Tester</text><text x="234" y="64" font-size="32" font-weight="600" fill="#0b0b0b" letter-spacing="-0.5">36–44 %</text><text x="234" y="84" font-size="11.5" fill="#6b6a65">of a full-mode task’s tokens:</text><text x="234" y="99" font-size="11.5" fill="#6b6a65">the costliest role</text></g><g><title>Light mode, cheaper by: 4.2×, 1.6M vs 6.8M IE per task (49 vs 138 min); its tasks are smaller</title><rect x="436.5" y="0.5" width="205" height="111" rx="8" fill="#f3f2ef" stroke="#e4e3df"/><rect x="452" y="16" width="3" height="12" rx="1.5" fill="#2