<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="300" viewBox="0 0 1280 300" role="img" aria-label="codis-agents: brief, analyst, analysis check, programmer, tester, reviewer, train, owner digest">
<style>.bg{fill:#f6f8fa;stroke:#d1d9e0}.n{fill:#ffffff;stroke:#d1d9e0}.o{fill:#ddf4ff;stroke:#0969da}.k{fill:#ffffff;stroke:#8250df;stroke-dasharray:5 4}.t{fill:#1f2328}.m{fill:#59636e}.a{fill:#0969da}.kc{fill:#8250df}.l{stroke:#818b98;fill:none}.ah{fill:#818b98}.pa{fill:#0969da}.pt{fill:#ffffff}text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif}</style>
