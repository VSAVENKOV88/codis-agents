<text class="t" x="640" y="58" text-anchor="middle" font-size="38" font-weight="700">codis-agents</text>
<text class="m" x="640" y="88" text-anchor="middle" font-size="16">A delivery team of role agents for Claude Code: each role tries to prove the one before it wrong</text>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0 0L10 5L0 10z"/></marker></defs><rect class="pa" x="82" y="110" width="52" height="18" rx="9"/><text class="pt" x="108" y="123" text-anchor="middle" font-size="11" font-weight="600">you</text><rect class="o" x="44.5" y="136.5" width="127" height="79" rx="8" stroke-width="1.5"/><text class="a" x="108" y="164" text-anchor="middle" font-size="15" font-weight="600">brief</text><text class="m" x="108" y="186" text-anchor="middle" font-size="11.5">owner&#39;s words</text><text class="m" x="108" y="201" text-anchor="middle" font-size="11.5">+ acceptance</text><path class="l" d="M175 176H192" stroke-width="1.5" marker-end="url(#ar)"/><rect class="n" x="196.5" y="136.5" width="127" height="79" rx="8" stroke-width="1.5"/><text class="t" x="260" y="164" text-anchor="middle" font-size="15" font-weight="600">analyst</text><text class="m" x="260" y="186" text-anchor="middle" font-size="11.5">cases</text><text class="m" x="260" y="201" text-anchor="middle" font-size="11.5">+ mechanism</text><path class="l" d="M327 176H344" stroke-width="1.5" marker-end="url(#ar)"/><rect class="k" x="348.5" y="136.5" width="127" height="79" rx="8" stroke-width="1.5"/><text class="kc" x="412" y="164" text-anchor="middle" font-size="15" font-weight="600">analysis check</text><text class="m" x="412" y="186" text-anchor="middle" font-size="11.5">tries to refute</text><text class="m" x="412" y="201" text-anchor="middle" font-size="11.5">the analysis</text><path class="l" d="M479 176H496" stroke-width="1.5" marker-end="url(#ar)"/><rect class="n" x="500.5" y="136.5" width="127" height="79" rx="8" stroke-width="1.5"/><text class="t" x="564" y="164" text-anchor="middle" font-size="15" font-weight="600">programmer</text><text class="m" x="564" y="186" text-anchor="middle" font-size="11.5">red guard first,</text><text class="m" x="564" y="201" text-anchor="middle" font-size="11.5">then the fix</text><path class="l" d="M631 176H648" stroke-width="1.5" marker-end="url(#ar)"/><rect class="k" x="652.5" y="136.5" width="127" height="79" rx="8" stroke-width="1.5"/><text class="kc" x="716" y="164" text-anchor="middle" font-size="15" font-weight="600">tester</text><text class="m" x="716" y="186" text-anchor="middle" font-size="11.5">own inventory,</text><text class="m" x="716" y="201" text-anchor="middle" font-size="11.5">real environment</text><path class="l" d="M783 176H800" stroke-width="1.5" marker-end="url(#ar)"/><rect class="k" x="804.5" y="136.5" width="127" height="79" rx="8" stroke-width="1.5"/><text class="kc" x="868" y="164" text-anchor="middle" font-size="15" font-weight="600">reviewer</text><text class="m" x="868" y="186" text-anchor="middle" font-size="11.5">reads only,</text><text class="m" x="868" y="201" text-anchor="middle" font-size="11.5">finds the hole</text><path class="l" d="M935 176H952" stroke-width="1.5" marker-end="url(#ar)"/><rect class="n" x="956.5" y="136.5" width="127" height="79" rx="8" stroke-width="1.5"/><text class="t" x="1020" y="164" text-anchor="middle" font-size="15" font-weight="600">train</text><text class="m" x="1020" y="186" text-anchor="middle" font-size="11.5">all guards over</text><text class="m" x="1020" y="201" text-anchor="middle" font-size="11.5">ready branches</text><path class="l" d="M1087 176H1104" stroke-width="1.5" marker-end="url(#ar)"/><rect class="pa" x="1146" y="110" width="52" height="18" rx="9"/><text class="pt" x="1172" y="123" text-anchor="middle" font-size="11" font-weight="600">you</text><rect class="o" x="1108.5" y="136.5" width="127" height="79" rx="8" stroke-width="1.5"/><text class="a" x="1172" y="164" text-anchor="middle" font-size="15" font-weight="600">owner digest</text><text class="m" x="1172" y="186" text-anchor="middle" font-size="11.5">one page</text><text class="m" x="1172" y="201" text-anchor="middle" font-size="11.5">per wave</text><path class="l" d="M716 216V246M868 216V246M1020 216V246H564V221" stroke-width="1.5" marker-end="url(#ar)"/><text class="m" x="792" y="272" text-anchor="middle" font-size="12">red tester round, rejection or red train: a fix round; the second one brings the analyst back</text><g font-size="11"><rect class="k" x="44.5" y="252.5" width="22" height="13" rx="3"/><text class="m" x="74" y="263">tries to refute</text></g></svg>
